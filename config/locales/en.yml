# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:

  devise:
    sessions:
      heading: "Welcome to our wallet.add platform"
      intro: "Discover the ultimate solution to easily and securely manage your digital wallet addresses across various blockchains. Our innovative platform is specifically designed to help you organize and manage your digital assets in a simple and user-friendly way.
      \n\nOur mission is to make managing your wallet addresses as easy as possible, providing you with a comprehensive and intuitive tool to track, organize, and handle all your addresses in one place.
      \n\nKey features:
      \n\n1. Add and manage addresses for various blockchains: Our platform supports a wide range of blockchains, including Bitcoin, Ethereum, Litecoin, and more. Add your addresses in just a few clicks and start managing them today.
      \n\n2. Organize and track wallets: Create custom categories for your wallets, assign names, and organize them however you like. You can also add notes to each wallet to keep track of transactions and assets.
      \n\n3. Security and privacy: We take your data security and privacy very seriously. Our platform uses advanced encryption technologies to ensure that only you have access to your information.
      \n\n4. User-friendly interface: Our sleek and modern interface makes managing your digital wallet addresses a breeze. Easily navigate between wallets and addresses and enjoy a smooth experience.
      \n\nSign up now and discover how our wallet address management platform can simplify and enhance your digital asset experience. Join the revolution and take control of your crypto investments today!"
