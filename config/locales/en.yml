  home:
    index:
      h2: "Simplify your digital asset management"
      intro: "Wallet Ad is a platform designed to help you centralize, organize, and secure your digital assets with ease.\n\nWhether you're a crypto enthusiast, a developer, or a curious investor, our solution allows you to manage all your blockchains, wallets, and addresses in a structured and streamlined way.\n\nUse Wallet Ad to:\n• Document the blockchains you follow or invest in,\n• Create and manage wallets linked to each blockchain,\n• Organize the addresses associated with your wallets for optimal transaction tracking.\n\nThe platform is designed to remain simple, secure, and adaptable to your needs—whether you're using it for personal, professional, or educational purposes."
      blockchain:
        title: "Blockchain"
        content: "Here, you can add, edit, and delete blockchains to organize and track the evolution of the different blockchain technologies you use. By adding a blockchain, you can then associate specific wallets to help manage your digital assets. Our platform supports several popular and emerging blockchains to meet your diverse cryptocurrency needs.
        \n\nA small detail: when you enter a blockchain that doesn't yet exist in our database, it is automatically added. This allows the community to benefit from everyone's contributions, resulting in a richer and more complete database.\n\nThis is the only piece of data shared between users—everything else remains strictly personal."
      wallet:
        title: "Wallet"
        content: "Our wallet management system allows you to create, manage, and monitor your digital wallets linked to different blockchains. When adding a wallet, you can select the corresponding blockchain from those you’ve previously added. Our platform makes it easy to organize and secure your cryptocurrency investments by centralizing all your wallets in one place."
      address:
        title: "Addresses"
        content: "Managing wallet addresses is essential to ensure the security and privacy of your transactions. Our platform allows you to add, edit, and delete addresses for each of your wallets. By adding an address, you can link it to a specific wallet, making it easier to track and organize your transactions. Our system helps you manage addresses securely and efficiently, so you can make the most of your crypto investments.
        \n\nNote: your addresses are unique and strictly personal. No other user—not even our team—can access or duplicate them. They are completely private and linked solely to your account."

