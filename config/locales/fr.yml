  home:
    index:
      h2: "Gérez vos actifs numériques en toute simplicité"
      intro: "Wallet Ad est une plateforme pensée pour vous aider à centraliser, organiser et sécuriser vos actifs numériques en toute simplicité. \n\nQue vous soyez un passionné de crypto, un développeur, ou un investisseur curieux, notre solution vous permet de gérer de manière structurée l’ensemble de vos blockchains, wallets et adresses en quelques clics.
      \n\n Utilisez Wallet Ad pour :
      \n• Documenter les blockchains que vous suivez ou dans lesquelles vous investissez,
      \n• Créer et gérer vos wallets en lien avec chaque blockchain,
      \n• Organiser vos adresses associées à vos wallets pour un suivi optimal de vos transactions.
      \n\nLa plateforme est conçue pour rester simple, sécurisée et adaptable à votre usage, que vous soyez dans une démarche personnelle, professionnelle ou pédagogique.
      "
      blockchain:
        title: "Blockchain"
        content: "Ici, vous pouvez ajouter, modifier et supprimer des blockchains pour organiser et suivre l'évolution des différentes technologies de blockchain que vous utilisez. En ajoutant une blockchain, vous pourrez ensuite y associer des wallets spécifiques pour faciliter la gestion de vos actifs numériques. Notre plateforme prend en charge plusieurs blockchains populaires et émergentes pour répondre à vos besoins diversifiés en matière de crypto-monnaies.
        \n\nPetite particularité : lorsqu’une blockchain que vous entrez n’existe pas encore dans notre base, elle y est automatiquement ajoutée. Cela permet à la communauté de bénéficier des ajouts de chacun, et d’avoir une base plus riche et plus complète.
        \n\nC’est la seule donnée partagée entre les utilisateurs, tout le reste reste strictement personnel.
        "
      wallet:
        title: "Porte-feuille"
        content: "Notre système de gestion de wallets vous permet de créer, gérer et suivre facilement vos wallets numériques associés à différentes blockchains. En ajoutant un wallet, vous pouvez sélectionner la blockchain correspondante à partir de celles que vous avez ajoutées précédemment. Notre plateforme facilite la gestion de vos actifs numériques en regroupant tous vos wallets en un seul endroit. Vous pouvez facilement ajouter, modifier et supprimer des wallets pour mieux organiser et protéger vos investissements en crypto-monnaies."
      address:
        title: "Adresses"
        content: "La gestion des adresses de wallet est essentielle pour assurer la sécurité et la confidentialité de vos transactions. Notre plateforme vous permet d'ajouter, modifier et supprimer des adresses pour chacun de vos wallets. En ajoutant une adresse, vous pouvez la lier à un wallet spécifique, ce qui vous permet de suivre et d'organiser vos transactions de manière plus efficace. Notre système vous aide à gérer vos adresses de manière sécurisée et conviviale, vous permettant ainsi de profiter pleinement de vos investissements en crypto-monnaies.
        \n\nÀ noter : vos adresses sont uniques et strictement personnelles. Aucun autre utilisateur – pas même notre équipe – ne peut accéder ou dupliquer vos adresses. Elles sont entièrement privées et liées uniquement à votre compte."

